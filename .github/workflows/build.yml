name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build APK via Native Script
      run: |
        cd launcher
        chmod +x build-and-install.sh
        
        # Startet das originale Build-Skript im reinen Build-Modus (ohne TV-Upload)
        ./build-and-install.sh --build

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-Home-Launcher-APK
        path: 'launcher/build/tvhome.apk'
        if-no-files-found: error
