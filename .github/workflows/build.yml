name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: List Repository Contents
      run: |
        echo "=== Inhalt des Hauptverzeichnisses ==="
        ls -la
        echo "=== Suche nach Gradle-Dateien im gesamten Repo ==="
        find . -name "*.gradle" -o -name "*.kts"
