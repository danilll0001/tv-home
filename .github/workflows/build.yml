name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Modern Gradle (8.5)
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Build APK Automatically
      run: |
        echo "Suche nach settings.gradle im Repository:"
        SETTINGS_PATH=$(find . -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
        echo "Gefunden: $SETTINGS_PATH"
        
        if [ -n "$SETTINGS_PATH" ]; then
          DIR=$(dirname "$SETTINGS_PATH")
          echo "Wechsle in den Ordner: $DIR"
          cd "$DIR"
        else
          echo "Keine settings.gradle gefunden! Suche nach build.gradle:"
          BUILD_PATH=$(find . -name "build.gradle" -o -name "build.gradle.kts" | grep -v "/build/" | head -n 1)
          DIR=$(dirname "$BUILD_PATH")
          echo "Wechsle in den Ordner: $DIR"
          cd "$DIR"
        fi
        
        echo "Aktuelles Verzeichnis: $(pwd)"
        ls -la
        
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew || true
        
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          gradle assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-Home-Launcher-APK
        path: '**/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: error
