name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Modern Gradle (8.5)
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: Run Build Script
      run: |
        cd launcher
        echo "Inhalt des Launcher-Ordners:"
        ls -la
        
        # Falls das Skript ausführbar gemacht werden muss
        chmod +x build-and-install.sh
        
        # Wir schauen uns das Skript kurz an und führen es aus
        cat build-and-install.sh
        ./build-and-install.sh || {
          echo "Fallback: Starte Gradle direkt..."
          gradle wrapper --gradle-version 8.5
          ./gradlew assembleDebug
        }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TV-Home-Launcher-APK
        path: 'launcher/app/build/outputs/apk/debug/app-debug.apk'
        if-no-files-found: error
